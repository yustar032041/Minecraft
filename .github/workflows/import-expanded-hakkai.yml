name: Import expanded Hakkai addon

on:
  push:
    paths:
      - '8界風記_GitHub投入用.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-expanded-addon:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Expand the packs without inspecting their contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil

          archive = Path("8界風記_GitHub投入用.zip")
          if not archive.is_file():
              raise SystemExit("Upload archive not found.")

          staging = Path(".hakkai-import-staging")
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir()

          with ZipFile(archive) as zf:
              members = zf.infolist()
              files = [m for m in members if not m.is_dir()]
              bp = [m for m in files if m.filename.startswith("Hakkai_v7.1.0/BehaviorPack/")]
              rp = [m for m in files if m.filename.startswith("Hakkai_v7.1.0/ResourcePack/")]
              if len(bp) != 1467 or len(rp) != 2858:
                  raise SystemExit(f"Unexpected file counts: BP={len(bp)}, RP={len(rp)}")

              for member in members:
                  name = member.filename
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
                  if not (
                      name == "8界風記完成設計書.md"
                      or name.startswith("Hakkai_v7.1.0/BehaviorPack/")
                      or name.startswith("Hakkai_v7.1.0/ResourcePack/")
                  ):
                      raise SystemExit(f"Unexpected archive entry: {name}")

              if not any(m.filename == "8界風記完成設計書.md" for m in files):
                  raise SystemExit("Design document missing.")

              zf.extractall(staging)

          doc = staging / "8界風記完成設計書.md"
          source_root = staging / "Hakkai_v7.1.0"
          bp_root = source_root / "BehaviorPack"
          rp_root = source_root / "ResourcePack"
          if not doc.is_file() or not bp_root.is_dir() or not rp_root.is_dir():
              raise SystemExit("Expected folder structure was not created.")

          shutil.copy2(doc, Path("8界風記完成設計書.md"))
          destination = Path("Hakkai_v7.1.0")
          destination.mkdir(exist_ok=True)
          for pack in ("BehaviorPack", "ResourcePack"):
              source = source_root / pack
              target = destination / pack
              if target.exists():
                  shutil.rmtree(target)
              shutil.copytree(source, target)

          old_file = Path("8kai_x5f_v7.1_x5f_ai_x5f_friendly.md")
          if old_file.exists():
              old_file.unlink()

          archive.unlink()
          shutil.rmtree(staging)
          PY

      - name: Commit imported folders and remove the previous single file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import expanded Hakkai v7.1.0 packs"
          git push origin HEAD:main
